name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0  # no major-version tag for this action
      - run: ruff format --check .

  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.13: what users run (the add-on installs it with uv; the Docker image)
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          # the next version, to see breakages early
          - { os: ubuntu-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Check the page scripts parse
        shell: bash
        run: for f in static/*.js; do node --check "$f"; done

  real-anki:
    # The add-on's bridge and the .apkg import against Anki's real engine (the
    # `anki` package, no window), with the oldest and the newest supported Anki.
    name: anki (${{ matrix.anki }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        anki: ["25.2.7", "latest"]  # latest: requirements-anki.txt (kept up to date by Dependabot)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          if [ "${{ matrix.anki }}" = latest ]; then
            pip install -r requirements-anki.txt
          else
            pip install -r requirements-dev.txt "anki==${{ matrix.anki }}"
          fi
      - run: pytest -q tests/test_real_anki.py

  addon-install:
    # The packaged add-on, unpacked as Anki would: downloads uv, installs Python
    # and the dependencies, starts the server (see tools/check_addon_install.py).
    name: addon install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # stands for Anki's Python, which runs the launcher
      - run: python tools/check_addon_install.py

  addon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python tools/build_addon.py
      - uses: actions/upload-artifact@v7
        with:
          name: cartable-addon
          path: dist/*.ankiaddon
          retention-days: 30
