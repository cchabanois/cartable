<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 1600px; overflow: hidden; }
  body { background: radial-gradient(circle at 70% 30%, #7d8a96, #46505a 75%); }
  .page {
    position: absolute; left: 90px; top: 80px; width: 1020px; height: 1420px;
    transform: rotate(1.6deg); background: #fbfaf5;
    box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.3);
  }
  .page::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(250deg, rgba(255,255,255,.2), rgba(0,0,0,.05) 55%, rgba(0,0,0,.12)); }
  h1 { font-family: 'Patrick Hand', sans-serif; font-size: 64px; margin: 50px 0 0 70px; color: #222; }
  .task { font-family: 'Patrick Hand', sans-serif; font-size: 34px; margin: 6px 0 0 70px; color: #555; }
  svg { position: absolute; left: 0; top: 190px; }
  .label { font-family: 'Caveat', cursive; font-size: 52px; font-weight: 700; fill: #1d3f9e; }
</style></head>
<body><div class="page">
<h1>Les parties d'une plante</h1>
<div class="task">Sciences — légende le schéma</div>
<svg width="1020" height="1200" viewBox="0 0 1020 1200">

      <ellipse cx="60" cy="60" rx="40" ry="66" transform="rotate(-45 60 60)" fill="#f7b8d2"/>
      <circle r="38" fill="#f5c84b"/>

  </g>

  <text class="label" x="90" y="490">feuille</text>
  <text class="label" x="750" y="715">tige</text>
  <text class="label" x="770" y="1080">racines</text>
</svg>
</div></body></html>
