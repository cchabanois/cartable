[project]
name = "notosaurus"
version = "0.1.0"  # the only place to change it (see CHANGELOG.md)
description = "Snap a lesson, get an Anki deck"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
# Dependencies: requirements.txt (the Anki add-on installs them with uv)

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # import order
  "UP",      # modern syntax
  "B",       # likely bugs
  "SIM",     # simpler code
  "RUF",     # ruff-specific
]
ignore = [
  "SIM108",                        # if/else blocks are often clearer than a ternary
  "RUF001", "RUF002", "RUF003",    # typographic characters (…, ×, →) are intended
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]  # FastAPI's way of declaring parameters

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]  # .env is loaded before the app modules read it
