<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>Cartable</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script defer src="i18n.js"></script>
  <script defer src="admin.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>
<div class="app has-bar" x-data="admin">

  <header class="appbar">
    <a class="brand" href="./">
      <span class="back">←</span>
      <img src="icon.svg" alt="" width="32" height="32">
      <span x-text="$t('admin.title')"></span>
    </a>
    <!-- Settings are saved as they change -->
    <span class="save-pill" x-cloak x-show="unlocked && form" :class="saveState">
      <span x-show="saveState === 'saved'" x-text="$t('admin.savedButton')"></span>
      <span x-show="saveState === 'pending' || saveState === 'saving'" x-text="$t('admin.saving')"></span>
      <span x-show="saveState === 'error'" x-text="$t('admin.notSaved')"></span>
    </span>
  </header>

  <div class="toast" x-cloak x-show="error" x-transition.opacity role="alert">
    <span x-text="error"></span>
    <button @click="error = ''" :aria-label="$t('common.close')">✕</button>
  </div>
  <div class="toast ok" x-cloak x-show="notice" x-transition.opacity role="status">
    <span x-text="notice"></span>
    <button @click="notice = ''" :aria-label="$t('common.close')">✕</button>
  </div>

  <main>
    <!-- First visit: create the admin password -->
    <!-- Anki add-on, opened from a phone: settings only open on the computer -->
    <section class="panel" x-cloak x-show="status && !status.allowed">
      <h2>🖥️ <span x-text="$t('admin.title')"></span></h2>
      <p class="hint" x-text="$t('errors.admin.local_only')"></p>
    </section>

    <section class="panel" x-cloak x-show="status?.allowed && status.password_needed && !status.password_set">
      <h2 x-text="$t('admin.create.title')"></h2>
      <p class="hint" x-text="$t('admin.create.hint')"></p>
      <form @submit.prevent="createPassword()">
        <label class="field"><span x-text="$t('admin.password')"></span>
          <input type="password" x-model="pw.new" autocomplete="new-password" minlength="4" required></label>
        <label class="field"><span x-text="$t('admin.confirm')"></span>
          <input type="password" x-model="pw.confirm" autocomplete="new-password" required></label>
        <button class="btn primary wide" x-text="$t('admin.create.button')"></button>
      </form>
    </section>

    <!-- Locked -->
    <section class="panel" x-cloak x-show="status?.allowed && status.password_needed && status.password_set && !unlocked">
      <h2 x-text="$t('admin.locked.title')"></h2>
      <form @submit.prevent="unlock()">
        <label class="field"><span x-text="$t('admin.locked.password')"></span>
          <input type="password" x-model="pw.login" x-ref="login" autocomplete="current-password" required></label>
        <button class="btn primary wide" x-text="$t('admin.locked.button')"></button>
      </form>
    </section>

    <template x-if="unlocked && form">
      <div>
        <!-- 1. Which AI service -->
        <section class="panel">
          <h2><span class="step">1</span> <span x-text="$t('admin.provider.title')"></span></h2>
          <div class="options">
            <template x-for="p in shownProviders()" :key="p.id">
              <label class="option" :class="{ active: form.llm === p.id }">
                <input type="radio" name="llm" :value="p.id" x-model="form.llm" @change="providerChanged()">
                <strong x-text="$t(`admin.provider.${p.id}.name`)"></strong>
                <small x-text="$t(`admin.provider.${p.id}.description`)"></small>
              </label>
            </template>
          </div>
          <p class="hint warn" x-show="form.llm === 'fake'" x-text="$t('admin.provider.fake.warning')"></p>
        </section>

        <!-- 2. Access: its key (and address); then its models can be listed -->
        <section class="panel" x-show="form.llm !== 'fake'">
          <h2><span class="step">2</span> <span x-text="$t('admin.access.title')"></span></h2>
          <!-- Another OpenAI-compatible service: its address -->
          <label class="field" x-show="form.llm === 'compatible'">
            <span x-text="$t('admin.access.apiAddress')"></span>
            <input x-model="form.compatible_base_url" placeholder="http://localhost:11434/v1">
            <small x-html="$t('admin.access.ollamaHint')"></small>
          </label>
          <template x-for="k in keysForProvider()" :key="k.field">
            <div class="field">
              <label :for="k.field"><span x-text="$t(k.label)"></span></label>
              <div class="with-action">
                <input type="password" :id="k.field" x-model="keys[k.field]" autocomplete="off"
                       @blur="commitKey(k.field)" @keydown.enter.prevent="commitKey(k.field)"
                       :placeholder="savedKey(k.field) ? $t('admin.access.keySaved', { masked: savedKey(k.field) }) : $t('admin.access.pasteKey')">
                <button type="button" class="icon-btn muted" x-show="savedKey(k.field)"
                        @click="clearKey(k.field)" :aria-label="$t('admin.access.clear', { label: $t(k.label) })">🗑</button>
              </div>
              <small x-show="savedKey(k.field)" x-text="$t('admin.access.replaceHint')"></small>
              <small x-show="k.help" x-html="k.help && $t(k.help)"></small>
              <small x-show="k.keyUrl"><span x-text="$t('admin.service.keyAt')"></span>
                <a :href="k.keyUrl" target="_blank" rel="noopener" x-text="k.keyUrl?.replace('https://', '')"></a>.</small>
              <small class="warn" x-show="keys[k.field] === null" x-text="$t('admin.access.willBeCleared')"></small>
            </div>
          </template>
        </section>

        <!-- 3. The model, and the test that it reads a photo and answers in JSON -->
        <section class="panel" x-show="form.llm !== 'fake'">
          <h2><span class="step">3</span> <span x-text="$t('admin.model.title')"></span></h2>
          <label class="field">
            <span x-text="$t('admin.provider.model')"></span>
            <input x-model="form.model" list="model-suggestions"
                   :placeholder="saved.default_models[form.llm] ? $t('admin.provider.default', { model: saved.default_models[form.llm] }) : ''">
            <datalist id="model-suggestions">
              <template x-for="m in modelSuggestions()" :key="m">
                <option :value="m"></option>
              </template>
            </datalist>
            <small x-show="!openaiLike()" x-text="$t('admin.provider.modelHint')"></small>
            <small x-show="openaiLike() && !modelAliases.length" x-text="$t('admin.service.vision')"></small>
          </label>
          <!-- OpenRouter: the latest model of each main family, the others on demand -->
          <div class="field" x-show="openaiLike() && modelAliases.length">
            <span x-text="$t('admin.service.aliases')"></span>
            <div class="chips">
              <template x-for="id in modelAliases" :key="id">
                <button type="button" class="chip" :class="{ active: (form.model || saved.default_models[form.llm]) === id }"
                        @click="form.model = id"
                        :title="id" x-text="(id === recommendedModel ? '⭐ ' : '') + modelLabel(id)"></button>
              </template>
            </div>
            <small x-text="$t('admin.service.aliasesHint', { count: loadedModels.length })"></small>
          </div>
          <div class="field" x-show="openaiLike()">
            <button type="button" class="btn soft" @click="loadModels()" :disabled="loadingModels" x-show="!loadedModels.length"
                    x-text="loadingModels ? $t('admin.service.loading') : $t('admin.service.loadModels')"></button>
            <p class="hint" x-show="modelsInfo" x-text="modelsInfo"></p>
          </div>
          <label class="field" x-show="form.llm === 'gemini'">
            <span x-text="$t('admin.provider.fallbacks')"></span>
            <input x-model="form.fallback_models" placeholder="gemini-3.5-flash-lite">
            <small x-text="$t('admin.provider.fallbacksHint')"></small>
          </label>
          <button type="button" class="btn soft wide" @click="test()" :disabled="testing">
            <span x-text="testing ? $t('admin.testing') : $t('admin.access.test')"></span>
          </button>
          <p class="test-result" x-show="testResult" :class="testResult?.ok ? 'ok' : 'ko'" x-text="testResult?.text"></p>
        </section>

        <!-- 4. Pictures on cards: an image model of its own (Claude can't draw) -->
        <section class="panel">
          <h2><span class="step" x-text="form.llm === 'fake' ? 2 : 4"></span> <span x-text="$t('admin.pictures.title')"></span></h2>
          <!-- Who draws: said plainly; by default the cards' own service -->
          <p class="picture-summary" x-text="pictureSummary()"></p>
          <div class="field">
            <span x-text="$t('admin.pictures.service')"></span>
            <div class="chips">
              <button type="button" class="chip" :class="{ active: !form.picture_service }" @click="setPictureService('')"
                      x-text="pictureServices.includes(form.llm) ? $t('admin.pictures.sameAsCards') : $t('admin.pictures.auto')"></button>
              <template x-for="id in pictureServices" :key="id">
                <button type="button" class="chip" :class="{ active: form.picture_service === id }" :disabled="!hasKey(id)"
                        @click="setPictureService(id)" :title="hasKey(id) ? '' : $t('admin.pictures.noKey')"
                        x-text="$t(`admin.provider.${id}.name`)"></button>
              </template>
              <button type="button" class="chip" :class="{ active: form.picture_service === 'none' }" @click="setPictureService('none')"
                      x-text="$t('admin.pictures.noneChip')"></button>
            </div>
          </div>
          <label class="field" x-show="drawingService()">
            <span x-text="$t('admin.pictures.model')"></span>
            <input x-model="form.picture_model" list="picture-models"
                   :placeholder="$t('admin.provider.default', { model: saved.pictures.default_models[drawingService()] ?? '' })">
            <datalist id="picture-models">
              <template x-for="m in PICTURE_MODELS[drawingService()] ?? []" :key="m">
                <option :value="m"></option>
              </template>
            </datalist>
            <small x-text="$t('admin.pictures.hint')"></small>
          </label>
        </section>

        <!-- Voice -->
        <section class="panel">
          <h2><span class="step" x-text="form.llm === 'fake' ? 3 : 5"></span> <span x-text="$t('admin.voice.title')"></span></h2>
          <label class="field">
            <span x-text="$t('admin.voice.rate')"></span>
            <select x-model="form.tts_rate">
              <option value="-25%" x-text="$t('admin.voice.slow')"></option>
              <option value="-10%" x-text="$t('admin.voice.slower')"></option>
              <option value="+0%" x-text="$t('admin.voice.normal')"></option>
            </select>
            <small x-text="$t('admin.voice.hint')"></small>
          </label>
        </section>

        <!-- Standing instructions for the AI: added to its fixed rules, for everyone and per profile -->
        <section class="panel">
          <h2 x-text="$t('admin.instructions.title')"></h2>
          <p class="hint" x-text="$t('admin.instructions.hint')"></p>
          <label class="field">
            <span x-text="$t('admin.instructions.general')"></span>
            <textarea x-model="form.instructions" rows="3" maxlength="4000"
                      :placeholder="$t('admin.instructions.generalPlaceholder')"></textarea>
          </label>
          <template x-for="profile in instructionProfiles()" :key="profile">
            <label class="field">
              <span x-text="lessons?.profiles && !lessons.profiles.includes(profile)
                ? $t('admin.instructions.missingProfile', { profile }) : $t('admin.instructions.profile', { profile })"></span>
              <textarea rows="2" maxlength="4000" :placeholder="$t('admin.instructions.profilePlaceholder')"
                        :value="form.profile_instructions[profile] ?? ''"
                        @input="form.profile_instructions = { ...form.profile_instructions, [profile]: $event.target.value }"></textarea>
            </label>
          </template>
          <p class="hint" x-show="!instructionProfiles().length" x-text="$t('admin.instructions.noProfiles')"></p>
        </section>

        <!-- Phones: the QR code lets one in; unpairing them all changes the token -->
        <section class="panel phones" x-show="phone">
          <h2 x-text="$t('admin.phones.title')"></h2>
          <p class="hint" x-text="$t('admin.phones.hint')"></p>
          <img class="qr" :src="phone && '/api/qr?' + new URLSearchParams({ text: phone.url })" :alt="$t('admin.phones.qr')" width="200" height="200">
          <p class="hint"><a :href="phone?.url" x-text="$t('admin.phones.thisDevice')"></a></p>
          <p class="hint" x-text="$t('admin.phones.security')"></p>
          <button type="button" class="btn danger-soft" @click="unpairPhones()" x-text="$t('admin.phones.unpair')"></button>
        </section>

        <!-- Anki -->
        <section class="panel">
          <h2 x-text="$t('admin.anki.title')"></h2>
          <p class="hint" x-show="saved.embedded" x-html="$t('admin.anki.embedded')"></p>
          <div x-show="!saved.embedded">
            <p class="hint" x-html="$t('admin.anki.howTo')"></p>
            <label class="field">
              <span x-text="$t('admin.anki.address')"></span>
              <input x-model="form.ankiconnect_url" placeholder="http://localhost:8765">
              <small x-html="$t('admin.anki.addressHint')"></small>
            </label>
            <div class="field">
              <label for="ankiconnect_key"><span><span x-text="$t('admin.anki.key')"></span>
                <small class="muted" x-text="$t('common.optional')"></small></span></label>
              <div class="with-action">
                <input type="password" id="ankiconnect_key" x-model="keys.ankiconnect_key" autocomplete="off"
                       @blur="commitKey('ankiconnect_key')" @keydown.enter.prevent="commitKey('ankiconnect_key')"
                       :placeholder="saved.ankiconnect_key ? $t('admin.access.keySaved', { masked: saved.ankiconnect_key }) : $t('admin.anki.keyPlaceholder')">
                <button type="button" class="icon-btn muted" x-show="saved.ankiconnect_key"
                        @click="clearKey('ankiconnect_key')" :aria-label="$t('admin.anki.clearKey')">🗑</button>
              </div>
            </div>
          </div>
          <label class="switch field">
            <input type="checkbox" x-model="form.anki_sync">
            <span class="track"><span class="knob"></span></span>
            <span><span x-text="$t('admin.anki.sync')"></span> <small x-text="$t('admin.anki.syncHint')"></small></span>
          </label>
          <!-- Whether the open profile can sync (the add-on knows; AnkiConnect doesn't say) -->
          <p class="hint" x-show="form.anki_sync && ankiStatus?.profile && ankiStatus?.sync === true"
             x-text="$t('admin.anki.syncOn', { profile: ankiStatus?.profile })"></p>
          <p class="hint warn" x-show="form.anki_sync && ankiStatus?.profile && ankiStatus?.sync === false"
             x-text="$t('admin.anki.syncOff', { profile: ankiStatus?.profile })"></p>
          <button type="button" class="btn soft wide" @click="testAnki()" :disabled="testingAnki">
            <span x-text="testingAnki ? $t('admin.testing') : $t('admin.anki.test')"></span>
          </button>
          <p class="test-result" x-show="ankiResult" :class="ankiResult?.ok ? 'ok' : 'ko'" x-text="ankiResult?.text"></p>
        </section>

        <!-- Lessons: who they belong to (changes apply right away, not with "Save") -->
        <section class="panel admin-lessons" x-show="lessons">
          <h2 x-text="$t('admin.lessons.title')"></h2>
          <p class="hint" x-text="$t('admin.lessons.hint')"></p>
          <p class="hint warn" x-show="lessons && !lessons.profiles" x-text="$t('admin.lessons.ankiClosed')"></p>
          <p class="hint" x-show="lessons && !lessons.lessons.length" x-text="$t('admin.lessons.none')"></p>
          <!-- What the AI cost, all lessons together -->
          <!-- From the journal of every AI call: deleting a lesson doesn't change it -->
          <div class="cost-total" x-show="lessons?.costs && (lessons.costs.total || lessons.costs.unknown)">
            <strong x-text="$t('admin.costs.total', { cost: formatCost(lessons?.costs.total) })"></strong>
            <small class="muted" x-show="lessons?.costs.deleted"
                   x-text="$t('admin.costs.deleted', { cost: formatCost(lessons?.costs.deleted) })"></small>
            <small class="muted" x-show="lessons?.costs.failed"
                   x-text="$t('admin.costs.failed', { cost: formatCost(lessons?.costs.failed) })"></small>
            <small class="muted" x-show="lessons?.costs.unknown"
                   x-text="$t('admin.costs.unknownCount', { count: lessons?.costs.unknown })"></small>
            <small class="muted" x-show="lessons?.costs.estimated" x-text="$t('admin.costs.estimated')"></small>
          </div>
          <ul class="admin-lesson-list">
            <template x-for="l in lessons?.lessons ?? []" :key="l.id">
              <li :class="{ orphan: ownerMissing(l) }">
                <div class="admin-lesson-head">
                  <strong x-text="l.deck"></strong>
                  <button type="button" class="icon-btn muted" @click="deleteLesson(l)"
                          :aria-label="$t('admin.lessons.delete')">🗑</button>
                </div>
                <small class="muted">
                  <span x-text="$t('common.count.cards', { count: l.card_count })"></span> ·
                  <span x-text="formatDate(l.updated_at)"></span>
                </small>
                <!-- AI calls: generation, then corrections -->
                <details class="ai-calls" x-show="l.ai_calls.length">
                  <summary x-text="costLine(l)"></summary>
                  <ul>
                    <template x-for="call in l.ai_calls" :key="call.at + call.kind">
                      <li x-text="callLine(call)"></li>
                    </template>
                  </ul>
                </details>
                <small class="muted" x-show="!l.ai_calls.length" x-text="$t('admin.costs.none')"></small>
                <div class="admin-lesson-access">
                  <label class="owner-pick">
                    <span x-text="$t('admin.lessons.owner')"></span>
                    <select @change="setAccess(l, { owner: $event.target.value })">
                      <option value="" :selected="!l.owner" x-text="$t('admin.lessons.noOwner')"></option>
                      <template x-for="p in ownerChoices(l)" :key="p">
                        <option :value="p" :selected="l.owner === p"
                                x-text="ownerMissing({ owner: p }) ? $t('admin.lessons.missing', { owner: p }) : p"></option>
                      </template>
                    </select>
                  </label>
                  <label class="switch" :class="{ disabled: !l.owner }">
                    <input type="checkbox" :checked="l.shared || !l.owner" :disabled="!l.owner"
                           @change="setAccess(l, { shared: $event.target.checked })">
                    <span class="track"><span class="knob"></span></span>
                    <span x-text="$t('admin.lessons.shared')"></span>
                  </label>
                </div>
              </li>
            </template>
          </ul>
        </section>

        <!-- Password -->
        <section class="panel" x-show="status.password_needed">
          <h2 x-text="$t('admin.passwordSection.title')"></h2>
          <form @submit.prevent="changePassword()">
            <label class="field"><span x-text="$t('admin.passwordSection.new')"></span>
              <input type="password" x-model="pw.new" autocomplete="new-password" minlength="4"></label>
            <label class="field"><span x-text="$t('admin.confirm')"></span>
              <input type="password" x-model="pw.confirm" autocomplete="new-password"></label>
            <button class="btn soft" :disabled="!pw.new" x-text="$t('admin.passwordSection.button')"></button>
          </form>
        </section>
      </div>
    </template>

    <!-- Language: automatic (Anki's or the browser's) or picked here, for this device -->
    <footer class="page-footer">
      <label class="lang-select">
        <span aria-hidden="true">🌐</span>
        <select :aria-label="$t('common.language')" :value="$store.i18n.choice"
                @change="setLanguage($event.target.value)">
          <option value="" :selected="!$store.i18n.choice"
                  x-text="$t('common.languageAuto', { name: $store.i18n.names[$store.i18n.auto] || $store.i18n.auto })"></option>
          <template x-for="code in $store.i18n.available" :key="code">
            <option :value="code" :selected="$store.i18n.choice === code" x-text="$store.i18n.names[code] || code"></option>
          </template>
        </select>
      </label>
      <span class="version" x-data="{ version: '' }" x-text="version && 'Cartable ' + version"
            x-init="version = (await (await fetch('/api/config')).json()).version"></span>
    </footer>
  </main>

</div>
</body>
</html>
