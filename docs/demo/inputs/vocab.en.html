<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 1600px; overflow: hidden; }
  body { background: radial-gradient(circle at 30% 20%, #8a6a4f, #5b4331 70%); }
  .page {
    position: absolute; left: 110px; top: 90px; width: 980px; height: 1400px;
    transform: rotate(-2.2deg);
    background:
      linear-gradient(90deg, transparent 118px, #e88 118px, #e88 121px, transparent 121px),
      repeating-linear-gradient(#fdfcf6 0 61px, #a9c4e6 61px 63px);
    background-color: #fdfcf6;
    box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 4px 10px rgba(0,0,0,.3);
    border-radius: 6px;
  }
  .page::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,.18), rgba(0,0,0,.06) 60%, rgba(0,0,0,.12)); }
  .holes { position: absolute; left: 40px; top: 150px; }
  .holes i { display: block; width: 34px; height: 34px; border-radius: 50%; background: #5b4331; margin-bottom: 420px;
    box-shadow: inset 0 3px 6px rgba(0,0,0,.6); }
  .content { position: absolute; left: 160px; top: 30px; right: 50px; font-family: 'Caveat', cursive; color: #1f2a6b; }
  h1 { font-size: 72px; margin: 0; line-height: 126px; font-weight: 700; color: #1d3f9e; }
  h1 u { text-decoration-thickness: 3px; }
  .sub { font-size: 50px; line-height: 63px; color: #333; margin-bottom: 0; }
  ul { list-style: none; padding: 0; margin: 0; font-size: 56px; line-height: 126px; }
  li { white-space: nowrap; }
  li b { font-weight: 700; color: #0d1b5e; }
  .hl { background: linear-gradient(transparent 55%, #fff27a 55%); }
</style></head>
<body><div class="page"><div class="holes"><i></i><i></i><i></i></div>
<div class="content">
  <h1><u>Spanish</u> — Unit 3: At school</h1>
  <ul>
    <li><b>el lápiz</b> = the pencil</li>
    <li><b>la mochila</b> = the backpack</li>
    <li><b>el cuaderno</b> = the notebook</li>
    <li><b>la goma</b> = the eraser</li>
    <li><b>la regla</b> = the ruler</li>
    <li><b>las tijeras</b> = the scissors</li>
    <li><b>el profesor</b> = the teacher <span style="font-size:44px">(m)</span></li>
    <li><b>la pizarra</b> = the board</li>
    <li class="hl"><b>¿Cómo se dice…?</b> = How do you say…?</li>
  </ul>
</div></div></body></html>
